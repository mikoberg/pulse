name: Build and deploy Pulse

on:
  push:
    branches: [main]
  schedule:
    # Hourly, so "Reserve Thursday" and "Leave in N minutes" stay accurate.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PULSE_CALENDAR_ICS_URL: https://mikoberg.github.io/techics/calendar.ics
      PULSE_CALENDAR_TRAVEL_MINUTES: "20"
      PULSE_GITHUB_OWNER: mikoberg
      PULSE_GITHUB_REPO: techics
      PULSE_GITHUB_BRANCH: main
      PULSE_WEATHER_LAT: "52.6667"
      PULSE_WEATHER_LON: "5.6167"
      PULSE_LAUNCH_ICS_URL: https://mikoberg.github.io/techics/calendar.ics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsx src/build.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
